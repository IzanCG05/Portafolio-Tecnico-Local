<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="application-name" content="Docsify" />
  <title>Proyecto Docsify</title>

  <!-- Tema visual: Variables CSS (Modo Oscuro por defecto + Modo Claro) -->
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-sidebar: #1e293b;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border-color: #334155;
    }

    [data-theme="light"] {
      --bg-main: #f8fafc;
      --bg-sidebar: #ffffff;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      display: flex;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Contenedor del Sidebar */
    #sidebar-container {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Contenido Principal */
    #app-content {
      flex: 1;
      padding: 2rem;
    }

    .theme-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- 1. Contenedor donde se cargará el Sidebar -->
  <aside id="sidebar-container">
    <p style="color: var(--text-muted);">Cargando menú...</p>
  </aside>

  <!-- 2. Área principal -->
  <main id="app-content">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
      <h1 id="app-title">Bienvenido</h1>
      <button id="theme-toggle" class="theme-btn">Cambiar Tema</button>
    </header>
    <p>Contenido principal de la aplicación.</p>
  </main>

  <!-- 3. Lógica de configuración, carga de Sidebar y cambio de tema -->
  <script>
    // Configuración global (name)
    const APP_CONFIG = {
      name: "MiApp",
      sidebarUrl: "./sidebar.html" // Ruta a tu archivo sidebar.html externo
    };

    // Aplicar el nombre de la app en el título y cabecera
    document.title = `${APP_CONFIG.name} | Inicio`;
    document.getElementById("app-title").textContent = `Bienvenido a ${APP_CONFIG.name}`;

    // Función para cargar el Sidebar (Load Sidebar)
    async function loadSidebar() {
      const container = document.getElementById("sidebar-container");
      try {
        const response = await fetch(APP_CONFIG.sidebarUrl);
        if (!response.ok) throw new Error("No se encontró sidebar.html");
        container.innerHTML = await response.text();
      } catch (error) {
        // Fallback por defecto si aún no has creado el archivo sidebar.html
        container.innerHTML = `
          <div>
            <h2 style="color: var(--accent); margin-bottom: 1.5rem;">${APP_CONFIG.name}</h2>
            <nav style="display: flex; flex-direction: column; gap: 0.75rem;">
              <a href="#" style="color: var(--text-primary); text-decoration: none;">Inicio</a>
              <a href="#" style="color: var(--text-muted); text-decoration: none;">Proyectos</a>
              <a href="#" style="color: var(--text-muted); text-decoration: none;">Ajustes</a>
            </nav>
          </div>
          <small style="color: var(--text-muted);">v1.0.0</small>
        `;
      }
    }

    // Alternar tema visual (Claro / Oscuro)
    const themeBtn = document.getElementById("theme-toggle");
    themeBtn.addEventListener("click", () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute("data-theme");
      html.setAttribute("data-theme", currentTheme === "dark" ? "light" : "dark");
    });

    // Inicializar
    document.addEventListener("DOMContentLoaded", loadSidebar);
  </script>
</body>
</html>
